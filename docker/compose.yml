# The live server's container, on the shared server that also runs fbc2 and vc.
# Run from the repo root:
#
#   docker/live-up.sh
#
# Settings aren't in the image: config.py is mounted from the repo root, and
# docker/.env, next to this file, is passed to the app as environment (for
# example SQLALCHEMY_DATABASE_URI, see config.py.tpl). A change to either
# needs the container recreated, not a rebuild: `docker/live-up.sh -n`.
# There is no database service: the app uses the MariaDB server's database,
# reached through SQLALCHEMY_DATABASE_URI (docker/.env, or config.py). Create
# its tables on a new database, and after each update that has a new migration:
#
#   docker compose -f docker/compose.yml exec tfc flask db upgrade
#
# Paths here are relative to this file's folder, docker/.
name: tfc

services:
  tfc:
    image: tfc:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    # Required: the live server's Compose (2.20) can't make it optional. An
    # empty one is fine; docker/live-up.sh makes one if it's missing.
    env_file: .env
    volumes:
      - type: bind
        source: ../config.py
        target: /app/config.py
        read_only: true
        # Fail if it's missing, rather than make an empty folder in its place.
        bind:
          create_host_path: false
      # UPLOAD_FOLDER in config.py.tpl: image files live in the uploads folder
      # at the repo root, not in the container. Make it before the first start.
      # scripts/backup.sh archives it. The app runs as UID 1000 (Dockerfile
      # APP_UID), so `chown 1000 uploads` it.
      - type: bind
        source: ../uploads
        target: /app/app/static/uploads
        bind:
          create_host_path: false
    ports:
      # Same port inside and out; fbc2 uses 20000 and vc 19999.
      - "9999:9999"
