# A local testing session: the app against its own throwaway MariaDB. Run from
# the repo root:
#
#   docker compose -f docker/compose.dev.yml --profile db up --build
#
# It needs a docker/.env (see docker/.env.example). MariaDB is optional until
# sub-issue #7 moves the app off MongoDB, so it is behind the `db` profile;
# its user, password and database come from SQLALCHEMY_DATABASE_URI in
# docker/.env (host "db"), see db-env.sh. The app still needs a MongoDB that
# MONGODB_SETTINGS in config.py can reach; there isn't one here, since the
# live server's is a separate container. Paths here are relative to this
# file's folder, docker/. Ports are on 127.0.0.1 only.
name: tfc-dev

services:
  db:
    profiles: ["db"]
    image: mariadb:10.11
    entrypoint: ["/db-entrypoint.sh"]
    command: ["mariadbd"]
    environment:
      SQLALCHEMY_DATABASE_URI: ${SQLALCHEMY_DATABASE_URI:-}
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - db:/var/lib/mysql
      - ./db-env.sh:/db-env.sh:ro
      - ./db-entrypoint.sh:/db-entrypoint.sh:ro
    ports:
      - "127.0.0.1:3309:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  tfc:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: tfc:dev
    env_file: .env
    depends_on:
      # Only waited for when the db profile is on.
      db:
        condition: service_healthy
        required: false
    volumes:
      - ../config.py:/app/config.py:ro
      - uploads:/app/app/static/uploads
    ports:
      - "127.0.0.1:5561:9999"

volumes:
  db:
  uploads:
