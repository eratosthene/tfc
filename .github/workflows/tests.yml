name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    # The tests run against a real MariaDB, as the app does. The database name
    # ends in _test, which tests/guard.py requires before it will run.
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root-password
          MARIADB_DATABASE: tfc_test
          MARIADB_USER: tfc
          MARIADB_PASSWORD: tfc-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      # For tests/test_migrate_mongo.py, which runs the one-time migration
      # script against a real MongoDB with GridFS.
      mongo:
        image: mongo:4.4
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Pipfile.lock

      # Pipfile.lock is the source of truth: export it, dev packages included,
      # and install exactly that. pymongo is only for the migration script's
      # tests, not the app, so it is not in the lock.
      - name: Install dependencies
        run: |
          python -m pip install pipenv
          pipenv requirements --dev > locked-requirements.txt
          python -m pip install -r locked-requirements.txt pymongo==4.6.3

      # TEST_DATABASE_URI is read by tests/test_config.py (without it the tests
      # use in-memory SQLite). tests/test_migrations.py runs the migrations on
      # this database and checks they match the models.
      - name: Run tests
        run: >-
          python -m pytest -v --color=yes
          --cov=app --cov-report=term-missing
        env:
          PYTHONUNBUFFERED: "1"
          TEST_MONGO_URI: mongodb://127.0.0.1:27017
          TEST_DATABASE_URI: mysql+pymysql://tfc:tfc-password@127.0.0.1:3306/tfc_test?charset=utf8mb4
