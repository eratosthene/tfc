name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    # The tests run against a real MariaDB, as the app does. The database name
    # ends in _test, which tests/guard.py requires before it will run.
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root-password
          MARIADB_DATABASE: tfc_test
          MARIADB_USER: tfc
          MARIADB_PASSWORD: tfc-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v7

      # The app is still on its 2022-era pins (Flask 1.1, Pillow 9.0, PyYAML
      # 6.0, ...). Python 3.10 is the newest version those have wheels for
      # (PyYAML 6.0 doesn't build on 3.11+), and the oldest setup-python
      # still offers on ubuntu-latest that Pipfile.lock installs on.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: Pipfile.lock

      # Pipfile.lock has no dev packages yet (it predates the test harness),
      # so `pipenv install --dev --deploy`, as fbc2 does, would fail. Install
      # the locked runtime packages, then the test tools from the Pipfile.
      # Switch to `pipenv install --dev --deploy` once the lock is regenerated.
      - name: Install dependencies
        run: |
          python -m pip install pipenv
          pipenv requirements > locked-requirements.txt
          python -m pip install -r locked-requirements.txt
          python -m pip install pytest pytest-cov

      # TEST_DATABASE_URI is read by tests/test_config.py (without it the tests
      # use in-memory SQLite). tests/test_migrations.py runs the migrations on
      # this database and checks they match the models.
      - name: Run tests
        run: >-
          python -m pytest -v --color=yes
          --cov=app --cov-report=term-missing
        env:
          PYTHONUNBUFFERED: "1"
          TEST_DATABASE_URI: mysql+pymysql://tfc:tfc-password@127.0.0.1:3306/tfc_test?charset=utf8mb4
