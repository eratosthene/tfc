name: Docker build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: tfc:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The app needs a database and config.py, so skip the entrypoint and
      # just check the packages it runs on import, and that config.py, which
      # holds the live credentials, isn't in the image.
      - name: Check the image's packages import
        run: >-
          docker run --rm --entrypoint python tfc:ci -c
          "import os, flask_appbuilder, flask_migrate, pymysql, PIL, dotenv, gunicorn;
          assert not os.path.exists('/app/config.py'), 'config.py is in the image'"

      # Catches OS-package and base-image issues. Report-only for now: the
      # base image is python:3.12-alpine now. Report-only until the scan has been
      # seen clean in CI; then set exit-code to "1".
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: tfc:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
