name: Dependency audit

# Checks every locked package against the PyPI/OSV vulnerability databases.
# The weekly run catches vulnerabilities disclosed after a package was locked.
on:
  pull_request:
    paths:
      - Pipfile
      - Pipfile.lock
      - .github/workflows/dependency-audit.yml
  push:
    branches: [main]
    paths:
      - Pipfile
      - Pipfile.lock
      - .github/workflows/dependency-audit.yml
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Export Pipfile.lock as a requirements file
        run: |
          python -m pip install pipenv
          pipenv requirements > locked-requirements.txt

      # Every version is pinned in the export, so audit it as-is instead of
      # resolving (and installing) it again. The results also go in the job
      # summary.
      #
      # continue-on-error: the lock still has Flask 2.2, Werkzeug 2.3 and
      # Pillow 10.4 (about 81 known vulnerabilities, see "Dependencies" in the
      # README), so this step fails today. It is report-only until the upgrades
      # (sub-issues 12 and 13) land; then delete the line so a finding fails the
      # job.
      - uses: pypa/gh-action-pip-audit@v1.1.0
        continue-on-error: true
        with:
          inputs: locked-requirements.txt
          no-deps: true
