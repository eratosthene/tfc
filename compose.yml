# The whole TFC stack: the app, MariaDB, and (temporarily) MongoDB.
#
#   cp .env.example .env && cp config.py.tpl config.py   # then fill in config.py
#   docker compose up --build
#
# Compose reads .env from this folder for the ${...} values below. See
# "Docker Compose" in README.rst for backups and restore.
name: tfc

services:
  # Not started by default: the app does not use MariaDB until sub-issue #7.
  # Start it with `docker compose --profile db up`. User, password and database
  # come from SQLALCHEMY_DATABASE_URI in .env (see docker/db-env.sh).
  db:
    profiles: ["db"]
    image: mariadb:10.11
    entrypoint: ["/db-entrypoint.sh"]
    command: ["mariadbd"]
    environment:
      SQLALCHEMY_DATABASE_URI: ${SQLALCHEMY_DATABASE_URI:-}
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - db:/var/lib/mysql
      - ./docker/db-env.sh:/db-env.sh:ro
      - ./docker/db-entrypoint.sh:/db-entrypoint.sh:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  # TEMPORARY: the app still stores its data in MongoDB until sub-issue #7
  # moves it to MariaDB. Remove this service, its volume and the app's
  # depends_on entry once that migration is verified. Set host to "mongo" in
  # MONGODB_SETTINGS in config.py while it is in use.
  mongo:
    image: mongo:4.4
    volumes:
      - mongo:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build: .
    image: tfc:latest
    env_file: .env
    depends_on:
      # Only waited for when the db profile is on (see the db service).
      db:
        condition: service_healthy
        required: false
      mongo:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./config.py:/app/config.py:ro
      # UPLOAD_FOLDER in config.py.tpl; image files live here, not in the container.
      - uploads:/app/app/static/uploads
    ports:
      # Loopback only; put a reverse proxy in front to expose it.
      - "${TFC_BIND:-127.0.0.1}:${TFC_PORT:-9999}:9999"

volumes:
  db:
  mongo:
  uploads:
